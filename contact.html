<body>

    <header>
        <h1>Contact Me</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="projects-grid.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main class="contact-container">

        <section class="contact-form">
            <h2>Send Me a Message</h2>
            <p>Have a question or want to work with me? Send me a message.</p>

            <form>
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <aside class="contact-info">
            <h2>Contact Information</h2>
            <p><strong>Email:</strong> michaelyugi598@gmail.com</p>
            <p><strong>Location:</strong> Kenya</p>
            <p><strong>Timezone:</strong> East Africa Time (EAT, UTC+3)</p>
            <p><strong>GitHub:</strong> <a href="https://github.com/michael-yugi" target="_blank">Visit my GitHub</a></p>
        </aside>

    </main>

</body>
</html>
